<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Arena - TeenagersITA Cards</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090e18 url('sfondohome.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 15px;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1;
    }

    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    /* VISTA STANZE */
    .rooms-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 5px;
      margin-bottom: 20px;
    }

    .room-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-info {
      text-align: left;
    }

    .room-title {
      font-weight: bold;
      font-size: 1rem;
      color: #fff;
    }

    .room-status {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .room-actions {
      display: flex;
      gap: 8px;
    }

    .btn-join {
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-disabled {
      background: #475569 !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-admin-single-reset {
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .private-section {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
      margin-top: 15px;
      text-align: left;
    }

    .private-controls {
      display: flex;
      gap: 10px;
    }

    .code-input {
      flex: 1;
      padding: 11px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.7);
      color: #fff;
      outline: none;
    }

    .btn-create {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .btn-admin-reset {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px dashed #ef4444;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
    }

    /* VISTA CAMPO DI BATTAGLIA */
    .turn-indicator {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      color: #60a5fa;
    }

    .turn-indicator.my-turn {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
      color: #4ade80;
    }

    .battle-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .player-section {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .player-info-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
    }

    /* BARRA XP IN BATTAGLIA */
    .player-xp-container {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: right;
    }

    .mini-xp-bar {
      width: 100px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 3px;
    }

    .mini-xp-fill {
      height: 100%;
      background: #10b981;
      width: 0%;
      transition: width 0.3s;
    }

    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .game-card {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .game-card.dead {
      opacity: 0.3;
      filter: grayscale(100%);
      pointer-events: none;
    }

    .game-card.targetable {
      border: 2px dashed #f59e0b;
      cursor: pointer;
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: #f59e0b; }
      50% { border-color: #ef4444; }
      100% { border-color: #f59e0b; }
    }

    .game-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 5px;
    }

    .card-name {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .hp-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .hp-bar-fill {
      height: 100%;
      background: #22c55e;
      width: 100%;
      transition: width 0.3s;
    }

    .hp-text {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .act-btn {
      padding: 5px;
      border-radius: 6px;
      border: none;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
    }

    .act-attack { background: #eab308; }
    .act-ability { background: #a855f7; }
    .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .hidden { display: none !important; }

    .btn-leave {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 15px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="main-container">
    
    <!-- VISTA 1: STANZE -->
    <div id="rooms-view">
      <h1>Stanze Multiplayer</h1>
      <p class="subtitle">Scegli una stanza pubblica o crea una partita privata!</p>

      <button id="admin-reset-btn" class="btn-admin-reset hidden" onclick="adminResetAllRooms()">🛡️ [ADMIN] Svuota Tutte le Stanze</button>

      <div class="rooms-grid" id="rooms-list">
        <p style="color: #94a3b8;">Caricamento stanze in corso...</p>
      </div>

      <div class="private-section">
        <button class="btn-create" onclick="createPrivateMatch()">🎮 Crea Partita Privata</button>
        <h3>Oppure unisciti con codice:</h3>
        <div class="private-controls">
          <input type="text" id="custom-code-input" class="code-input" placeholder="Inserisci codice" oninput="this.value = this.value.toUpperCase()">
          <button class="btn-join" onclick="joinByCode()">Entra</button>
        </div>
      </div>

      <a href="index.html" class="back-link">← Torna al Menu Principale</a>
    </div>

    <!-- VISTA 2: CAMPO DI BATTAGLIA -->
    <div id="lobby-view" class="hidden">
      <h1 id="current-room-title">Partita Multiplayer</h1>
      <div id="turn-badge" class="turn-indicator">In attesa dell'avversario...</div>

      <div class="battle-grid">
        <!-- SEZIONE AVVERSARIO -->
        <div class="player-section">
          <div class="player-header">
            <div class="player-info-left">
              <img src="logo.png" class="player-avatar">
              <span id="enemy-name">Avversario</span>
            </div>
            <div class="player-xp-container">
              <span id="enemy-level-text">Lv. 1</span>
              <div class="mini-xp-bar"><div id="enemy-xp-fill" class="mini-xp-fill"></div></div>
            </div>
          </div>
          <div id="enemy-hand" class="cards-row"></div>
        </div>

        <!-- SEZIONE MIEI DATI -->
        <div class="player-section">
          <div class="player-header">
            <div class="player-info-left">
              <img src="logo.png" class="player-avatar">
              <span id="my-name">Tu</span>
            </div>
            <div class="player-xp-container">
              <span id="my-level-text">Lv. 1</span>
              <div class="mini-xp-bar"><div id="my-xp-fill" class="mini-xp-fill"></div></div>
            </div>
          </div>
          <div id="my-hand" class="cards-row"></div>
        </div>
      </div>

      <button class="btn-leave" onclick="leaveRoom()">Abbandona Stanza</button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      setDoc, 
      updateDoc, 
      onSnapshot,
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const ADMIN_UIDS = [
      "hObA3vADPIfO0VDuaERwjFFzx303",
      "LRS2V4mx1kOKGZl65J1DYzqRX9q1",
      "vaUTilhimXfpcPuhFM1z2llA9mZ2"
    ];

    let isAdmin = false;

    const teenCardsArchive = {
      "frontealpino": { name: "Fronte Alpino", image: "frontealpino.png", hp: 80, maxHp: 80, attack: { damage: 10 }, ability: { name: "Abilità", damage: 20 } },
      "clipp3r": { name: "Clipp3r", image: "clipp3r.png", hp: 80, maxHp: 80, attack: { damage: 15 }, ability: { name: "Sketchbook", damage: 30 } },
      "fronte": { name: "Fronte", image: "fronte.png", hp: 100, maxHp: 100, attack: { damage: 15 }, ability: { name: "Bombardata", damage: 60 } },
      "aspro": { name: "Aspro", image: "aspro.png", hp: 100, maxHp: 100, attack: { damage: 20 }, ability: { name: "Aspro", damage: 50 } },
      "automoderator": { name: "Automoderator", image: "automoderator.png", hp: 40, maxHp: 40, attack: { damage: 10 }, ability: { name: "Ban", damage: 999 } },
      "illuminick138": { name: "Illuminick138", image: "illuminick138.png", hp: 80, maxHp: 80, attack: { damage: 15 }, ability: { name: "Attacco Psicoanalitico", damage: 50, heal: 10 } },
      "nannikart60peironi": { name: "Nannikart60Peironi", image: "nannikart60peironi.png", hp: 80, maxHp: 80, attack: { damage: 15 }, ability: { name: "Forbici Razzo", damage: 69 }, ability2: { name: "Fagioli", damage: 40 } },
      "batzupper": { name: "Batzupper", image: "batzupper.png", hp: 90, maxHp: 90, attack: { damage: 15 }, ability: { name: "Jetpack Zuppa", damage: 30 }, ability2: { name: "Raggio di Nerd", damage: 60 } }
    };

    const firebaseConfig = {
      apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
      authDomain: "teenagersita-cards.firebaseapp.com",
      projectId: "teenagersita-cards",
      storageBucket: "teenagersita-cards.firebasestorage.app",
      messagingSenderId: "651917703980",
      appId: "1:651917703980:web:d4c8f87b4645e97c46ca89"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userProfileData = { username: "Giocatore", xp: 0, level: 1, coins: 0 };
    let activeRoomId = null;
    let unsubscribeRoomListener = null;

    let selectedAttackerIndex = null;
    let selectedMoveType = null;
    let targetingMode = false;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        
        if (ADMIN_UIDS.includes(user.uid)) {
          isAdmin = true;
          document.getElementById('admin-reset-btn').classList.remove('hidden');
        }

        const userDoc = await getDoc(doc(db, "utenti", user.uid));
        if (userDoc.exists()) {
          const d = userDoc.data();
          userProfileData.username = d.username || user.email.split('@')[0];
          userProfileData.xp = d.xp || 0;
          userProfileData.coins = d.coins || 0;
          userProfileData.level = Math.floor(userProfileData.xp / 100) + 1;
        } else {
          userProfileData.username = user.email ? user.email.split('@')[0] : "Giocatore";
        }
        listenToRooms();
      } else {
        alert("Devi accedere per giocare!");
        window.location.href = "account.html";
      }
    });

    window.adminResetSingleRoom = async function(roomId, e) {
      e.stopPropagation();
      if (!currentUser || !isAdmin) return;
      if (!confirm(`Vuoi svuotare la ${roomId.replace('stanza_', 'Stanza ').toUpperCase()}?`)) return;

      try {
        await updateDoc(doc(db, "rooms", roomId), {
          status: "waiting",
          player1: null,
          player2: null,
          turn: null,
          lastActive: null
        });
        alert("Stanza svuotata con successo!");
      } catch (err) {
        console.error("Errore:", err);
      }
    };

    window.adminResetAllRooms = async function() {
      if (!currentUser || !isAdmin) return;
      if (!confirm("Sei sicuro di voler svuotare tutte le stanze?")) return;

      try {
        const querySnapshot = await getDocs(collection(db, "rooms"));
        const promises = querySnapshot.docs.map(roomDoc => 
          updateDoc(doc(db, "rooms", roomDoc.id), {
            status: "waiting",
            player1: null,
            player2: null,
            turn: null,
            lastActive: null
          })
        );
        await Promise.all(promises);
        alert("Tutte le stanze sono state svuotate!");
      } catch (err) {
        console.error("Errore:", err);
      }
    };

    function generateRandomHand() {
      const keys = Object.keys(teenCardsArchive);
      const hand = [];
      for (let i = 0; i < 4; i++) {
        const randKey = keys[Math.floor(Math.random() * keys.length)];
        const card = teenCardsArchive[randKey];
        hand.push({
          uid: randKey + "_" + Math.random().toString(36).substr(2, 5),
          cardId: randKey,
          name: card.name,
          image: card.image,
          hp: card.hp,
          maxHp: card.maxHp,
          attack: card.attack.damage,
          abilityDamage: card.ability.damage,
          abilityName: card.ability.name,
          abilityHeal: card.ability.heal || 0,
          abilityUsed: false,
          ability2Name: card.ability2 ? card.ability2.name : null,
          ability2Damage: card.ability2 ? card.ability2.damage : null,
          ability2Used: false
        });
      }
      return hand;
    }

    function listenToRooms() {
      onSnapshot(collection(db, "rooms"), async (snapshot) => {
        const roomsListEl = document.getElementById('rooms-list');
        roomsListEl.innerHTML = "";
        
        const now = Date.now();
        const twoMinutes = 2 * 60 * 1000;

        for (const docSnap of snapshot.docs) {
          const roomId = docSnap.id;
          const roomData = docSnap.data();

          if (roomData.lastActive && (now - roomData.lastActive > twoMinutes)) {
            await updateDoc(doc(db, "rooms", roomId), {
              status: "waiting",
              player1: null,
              player2: null,
              turn: null,
              lastActive: null
            });
            continue;
          }

          if (roomId.startsWith('stanza_')) {
            let count = 0;
            if (roomData.player1) count++;
            if (roomData.player2) count++;

            const isFull = count >= 2;
            const roomCard = document.createElement('div');
            roomCard.className = 'room-card';
            
            roomCard.innerHTML = `
              <div class="room-info">
                <div class="room-title">${roomId.replace('stanza_', 'Stanza ').toUpperCase()}</div>
                <div class="room-status">${count}/2 Giocatori</div>
              </div>
              <div class="room-actions">
                ${isAdmin ? `<button class="btn-admin-single-reset" onclick="adminResetSingleRoom('${roomId}', event)">Svuota</button>` : ''}
                <button class="btn-join ${isFull ? 'btn-disabled' : ''}" 
                        onclick="joinRoom('${roomId}')" ${isFull ? 'disabled' : ''}>
                  ${isFull ? 'Piena' : 'Entra'}
                </button>
              </div>
            `;
            roomsListEl.appendChild(roomCard);
          }
        }
      });
    }

    window.joinRoom = async function(roomId) {
      if (!currentUser) return;
      const roomRef = doc(db, "rooms", roomId);
      const roomSnap = await getDoc(roomRef);

      let roomData = roomSnap.exists() ? roomSnap.data() : {};
      let updatePayload = {};

      if (!roomData.player1) {
        updatePayload.player1 = { 
          uid: currentUser.uid, 
          username: userProfileData.username, 
          xp: userProfileData.xp,
          level: userProfileData.level,
          hand: generateRandomHand() 
        };
        updatePayload.status = "waiting";
        updatePayload.lastActive = Date.now();
      } else if (!roomData.player2 && roomData.player1.uid !== currentUser.uid) {
        updatePayload.player2 = { 
          uid: currentUser.uid, 
          username: userProfileData.username, 
          xp: userProfileData.xp,
          level: userProfileData.level,
          hand: generateRandomHand() 
        };
        updatePayload.status = "playing";
        updatePayload.turn = roomData.player1.uid;
        updatePayload.lastActive = Date.now();
      } else {
        alert("Impossibile entrare nella stanza.");
        return;
      }

      await updateDoc(roomRef, updatePayload);
      activeRoomId = roomId;

      updateRoomTitleDisplay(roomId);
      document.getElementById('rooms-view').classList.add('hidden');
      document.getElementById('lobby-view').classList.remove('hidden');
      listenToCurrentRoom(roomId);
    };

    window.createPrivateMatch = async function() {
      if (!currentUser) return;
      const code = "priv_" + Math.random().toString(36).substring(2, 7).toUpperCase();
      const roomRef = doc(db, "rooms", code);

      await setDoc(roomRef, {
        status: "waiting",
        player1: { 
          uid: currentUser.uid, 
          username: userProfileData.username, 
          xp: userProfileData.xp,
          level: userProfileData.level,
          hand: generateRandomHand() 
        },
        player2: null,
        lastActive: Date.now()
      });

      activeRoomId = code;
      updateRoomTitleDisplay(code);

      document.getElementById('rooms-view').classList.add('hidden');
      document.getElementById('lobby-view').classList.remove('hidden');
      listenToCurrentRoom(code);
    };

    window.joinByCode = async function() {
      const code = document.getElementById('custom-code-input').value.trim().toUpperCase();
      if (code) window.joinRoom("priv_" + code.replace("PRIV_", ""));
    };

    function updateRoomTitleDisplay(roomId) {
      const titleEl = document.getElementById('current-room-title');
      if (roomId.startsWith('priv_')) {
        const cleanCode = roomId.replace('priv_', '');
        titleEl.innerText = `Partita Privata (Codice: ${cleanCode})`;
      } else {
        titleEl.innerText = roomId.replace('stanza_', 'Stanza ').toUpperCase();
      }
    }

    function listenToCurrentRoom(roomId) {
      updateRoomTitleDisplay(roomId);
      const roomRef = doc(db, "rooms", roomId);
      unsubscribeRoomListener = onSnapshot(roomRef, async (docSnap) => {
        if (!docSnap.exists()) return;
        const data = docSnap.data();

        if (data.status === "waiting" && (!data.player1 && !data.player2)) {
          alert("La stanza è stata svuotata.");
          window.leaveRoom();
          return;
        }

        const isP1 = data.player1 && data.player1.uid === currentUser.uid;
        const isP2 = data.player2 && data.player2.uid === currentUser.uid;

        if (!isP1 && !isP2 && activeRoomId) {
          window.leaveRoom();
          return;
        }

        const myData = isP1 ? data.player1 : data.player2;
        const enemyData = isP1 ? data.player2 : data.player1;

        const turnBadge = document.getElementById('turn-badge');
        const isMyTurn = data.turn === currentUser.uid;

        if (data.status === "waiting") {
          turnBadge.innerText = "In attesa dell'avversario...";
          turnBadge.className = "turn-indicator";
          targetingMode = false;
        } else if (isMyTurn) {
          if (targetingMode) {
            turnBadge.innerText = "🎯 CLICCA SUL BERSAGLIO!";
            turnBadge.className = "turn-indicator my-turn";
          } else {
            turnBadge.innerText = "È IL TUO TURNO! Scegli una mossa";
            turnBadge.className = "turn-indicator my-turn";
          }
        } else {
          turnBadge.innerText = "Turno dell'avversario...";
          turnBadge.className = "turn-indicator";
          targetingMode = false;
        }

        // Renderizza i tuoi dati e XP
        if (myData) {
          document.getElementById('my-name').innerText = myData.username + " (Tu)";
          const myXp = myData.xp || 0;
          const myLvl = Math.floor(myXp / 100) + 1;
          const myXpInLvl = myXp % 100;
          document.getElementById('my-level-text').innerText = `Lv. ${myLvl}`;
          document.getElementById('my-xp-fill').style.width = `${myXpInLvl}%`;

          renderHand(document.getElementById('my-hand'), myData.hand, true, isMyTurn);
        }

        // Renderizza dati e XP dell'avversario
        if (enemyData) {
          document.getElementById('enemy-name').innerText = enemyData.username;
          const enemyXp = enemyData.xp || 0;
          const enemyLvl = Math.floor(enemyXp / 100) + 1;
          const enemyXpInLvl = enemyXp % 100;
          document.getElementById('enemy-level-text').innerText = `Lv. ${enemyLvl}`;
          document.getElementById('enemy-xp-fill').style.width = `${enemyXpInLvl}%`;

          renderHand(document.getElementById('enemy-hand'), enemyData.hand, false, isMyTurn);
        } else {
          document.getElementById('enemy-name').innerText = "Avversario";
          document.getElementById('enemy-level-text').innerText = "Lv. -";
          document.getElementById('enemy-xp-fill').style.width = `0%`;
          document.getElementById('enemy-hand').innerHTML = "<p style='color:#94a3b8;'>Attesa giocatore...</p>";
        }
      });
    }

    function renderHand(container, hand, isMine, isMyTurn) {
      container.innerHTML = "";
      if (!hand) return;

      hand.forEach((card, index) => {
        const cardEl = document.createElement('div');
        let cardClasses = `game-card ${card.hp <= 0 ? 'dead' : ''}`;

        if (targetingMode && !isMine && card.hp > 0) {
          cardClasses += " targetable";
        }

        cardEl.className = cardClasses;
        const hpPercent = Math.max(0, (card.hp / card.maxHp) * 100);

        let htmlContent = `
          <img src="${card.image}" alt="${card.name}">
          <div class="card-name">${card.name}</div>
          <div class="hp-bar-container">
            <div class="hp-bar-fill" style="width: ${hpPercent}%"></div>
          </div>
          <div class="hp-text">${Math.max(0, card.hp)} / ${card.maxHp} HP</div>
        `;

        if (isMine && card.hp > 0) {
          htmlContent += `
            <div class="card-actions">
              <button class="act-btn act-attack" ${!isMyTurn || targetingMode ? 'disabled' : ''} onclick="prepareMove(${index}, 'attack')">Attacca (${card.attack})</button>
              <button class="act-btn act-ability" ${!isMyTurn || card.abilityUsed || targetingMode ? 'disabled' : ''} onclick="prepareMove(${index}, 'ability')">${card.abilityName}</button>
              ${card.ability2Name ? `<button class="act-btn act-ability" ${!isMyTurn || card.ability2Used || targetingMode ? 'disabled' : ''} onclick="prepareMove(${index}, 'ability2')">${card.ability2Name}</button>` : ''}
            </div>
          `;
        }

        cardEl.innerHTML = htmlContent;

        if (targetingMode && !isMine && card.hp > 0) {
          cardEl.onclick = () => executeMove(index);
        }

        container.appendChild(cardEl);
      });
    }

    window.prepareMove = function(cardIndex, type) {
      selectedAttackerIndex = cardIndex;
      selectedMoveType = type;
      targetingMode = true;

      const turnBadge = document.getElementById('turn-badge');
      turnBadge.innerText = "🎯 Scegli quale carta dell'avversario colpire!";
      turnBadge.className = "turn-indicator my-turn";

      const roomRef = doc(db, "rooms", activeRoomId);
      getDoc(roomRef).then(docSnap => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          const isP1 = data.player1.uid === currentUser.uid;
          renderHand(document.getElementById('enemy-hand'), isP1 ? data.player2.hand : data.player1.hand, false, true);
        }
      });
    };

    window.executeMove = async function(targetCardIndex) {
      if (!activeRoomId || !currentUser || !targetingMode) return;

      const roomRef = doc(db, "rooms", activeRoomId);
      const roomSnap = await getDoc(roomRef);
      if (!roomSnap.exists()) return;

      const data = roomSnap.data();
      if (data.turn !== currentUser.uid) return;

      const isP1 = data.player1.uid === currentUser.uid;
      const myData = isP1 ? data.player1 : data.player2;
      const enemyData = isP1 ? data.player2 : data.player1;

      if (!enemyData || !enemyData.hand[targetCardIndex] || enemyData.hand[targetCardIndex].hp <= 0) {
        alert("Bersaglio non valido o già eliminato!");
        targetingMode = false;
        return;
      }

      const myCard = myData.hand[selectedAttackerIndex];
      let damage = 0;

      if (selectedMoveType === 'attack') {
        damage = myCard.attack;
      } else if (selectedMoveType === 'ability') {
        damage = cardIdIsAutomoderator(myCard) ? enemyData.hand[targetCardIndex].hp : myCard.abilityDamage;
        myCard.abilityUsed = true;

        if (myCard.cardId === "illuminick138" && myCard.abilityHeal > 0) {
          const aliveAllies = myData.hand.filter(c => c.hp > 0 && c.hp < c.maxHp);
          if (aliveAllies.length > 0) {
            aliveAllies[0].hp = Math.min(aliveAllies[0].maxHp, aliveAllies[0].hp + myCard.abilityHeal);
          }
        }
      } else if (selectedMoveType === 'ability2') {
        damage = myCard.ability2Damage;
        myCard.ability2Used = true;
      }

      enemyData.hand[targetCardIndex].hp -= damage;
      targetingMode = false;

      // CONTROLLO VITTORIA: Se l'avversario non ha più carte vive
      const hasEnemyAlive = enemyData.hand.some(c => c.hp > 0);
      if (!hasEnemyAlive) {
        alert("🎉 Complimenti! Hai vinto la partita e guadagnato +15 XP e +5 Monete!");
        await awardWinAndRewards(currentUser.uid);
        window.leaveRoom();
        return;
      }

      const nextTurn = enemyData.uid;

      const updatePayload = {};
      if (isP1) {
        updatePayload.player1 = myData;
        updatePayload.player2 = enemyData;
      } else {
        updatePayload.player2 = myData;
        updatePayload.player1 = enemyData;
      }
      updatePayload.turn = nextTurn;
      updatePayload.lastActive = Date.now();

      await updateDoc(roomRef, updatePayload);
    };

    // Assegna 15 XP e 5 Monete al vincitore su Firestore (collezione "utenti")
    async function awardWinAndRewards(userId) {
      try {
        const userRef = doc(db, "utenti", userId);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
          const d = userSnap.data();
          const currentXp = (d.xp || 0) + 15;
          const currentCoins = (d.coins || 0) + 5;
          const currentWins = (d.wins || 0) + 1;
          const newLevel = Math.floor(currentXp / 100) + 1;

          await updateDoc(userRef, {
            xp: currentXp,
            coins: currentCoins,
            wins: currentWins,
            level: newLevel
          });
        } else {
          await setDoc(userRef, {
            xp: 15,
            coins: 5,
            wins: 1,
            level: 1
          }, { merge: true });
        }
      } catch (err) {
        console.error("Errore aggiornamento ricompense vittoria:", err);
      }
    }

    function cardIdIsAutomoderator(card) {
      return card.cardId === "automoderator";
    }

    window.leaveRoom = async function() {
      targetingMode = false;
      if (activeRoomId && currentUser) {
        const roomRef = doc(db, "rooms", activeRoomId);
        const roomSnap = await getDoc(roomRef);
        if (roomSnap.exists()) {
          const data = roomSnap.data();
          const updatePayload = {};

          if (data.player1 && data.player1.uid === currentUser.uid) updatePayload.player1 = null;
          if (data.player2 && data.player2.uid === currentUser.uid) updatePayload.player2 = null;

          updatePayload.status = "waiting";
          updatePayload.turn = null;
          updatePayload.lastActive = null;

          await updateDoc(roomRef, updatePayload);
        }
      }

      if (unsubscribeRoomListener) unsubscribeRoomListener();
      activeRoomId = null;
      document.getElementById('lobby-view').classList.add('hidden');
      document.getElementById('rooms-view').classList.remove('hidden');
    };

    window.addEventListener('beforeunload', () => {
      if (activeRoomId) {
        window.leaveRoom();
      }
    });
  </script>
</body>
</html>
