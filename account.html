<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profilo Account - TeenagersITA</title>
<link rel="icon" href="teenagersitalogo2.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background-color: #07152b;
    background-image: linear-gradient(rgba(3, 10, 22, 0.75), rgba(7, 21, 43, 0.85)), url('sfondo2.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 600px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 24px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; text-align: center; padding: 30px 20px; }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    color: #fff;
    text-shadow: 0 0 14px rgba(90,180,255,.9), 0 2px 4px rgba(0,0,0,.8);
  }

  .user-card {
    text-align: center;
    padding: 20px;
  }

  .username-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: #60a5fa;
    text-shadow: 0 0 10px rgba(96,165,250,0.5);
    margin: 10px 0;
  }

  .info-label {
    font-size: 0.9rem;
    color: #8fb4dc;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 15px;
  }

  .info-value {
    font-size: 1.1rem;
    color: #fff;
    font-weight: 500;
  }

  .btn {
    display: inline-block;
    width: 100%;
    min-height: 48px;
    padding: 12px 28px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,20,60,.9);
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 16px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
    font-size: 1rem;
    margin-top: 15px;
  }

  .btn-secondary {
    background: linear-gradient(180deg, rgba(80,160,255,0.3) 0%, rgba(20,60,120,0.5) 100%);
    border: 1px solid rgba(140,200,255,0.4);
    box-shadow: none;
  }

  .hidden { display: none !important; }
  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Il Tuo Profilo</h1>
    <p style="margin:0; color:#bcd9f7;">Gestisci le informazioni del tuo account</p>
  </header>

  <main class="glass user-card">
    <div class="info-label">Username Utente</div>
    <div id="username-display" class="username-title">Caricamento...</div>

    <div class="info-label">Stato Account</div>
    <div id="status-display" class="info-value">Verifica in corso...</div>

    <div style="margin-top: 30px;">
      <a href="index.html" class="btn">Torna alla Gioco</a>
      <button id="logout-btn" class="btn btn-secondary hidden" onclick="handleLogout()">Disconnettiti</button>
    </div>
  </main>

  <footer>Carte TeenagersITA · Progetto NON ufficiale</footer>

</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    getDoc 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Inserisci qui la configurazione Firebase del progetto di Gioco principale
  const firebaseConfig = {
    apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
    authDomain: "teenagersita-cards.firebaseapp.com",
    projectId: "teenagersita-cards",
    storageBucket: "teenagersita-cards.firebasestorage.app",
    messagingSenderId: "651917703980",
    appId: "1:651917703980:web:d4c8f87b4645e97c46ca89"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    const usernameElem = document.getElementById('username-display');
    const statusElem = document.getElementById('status-display');
    const logoutBtn = document.getElementById('logout-btn');

    if (user) {
      let detectedName = "";

      // 1. Prova prima a recuperare il nickname salvato su Firestore
      try {
        const userDocRef = doc(db, "utenti", user.uid);
        const userDocSnap = await getDoc(userDocRef);

        if (userDocSnap.exists()) {
          const data = userDocSnap.data();
          if (data.username) detectedName = data.username;
          else if (data.nickname) detectedName = data.nickname;
          else if (data.displayName) detectedName = data.displayName;
        }
      } catch (err) {
        console.warn("Lettura Firestore non riuscita, uso fallback email:", err);
      }

      // 2. Se non presente su Firestore, estrae il nickname dall'email interna
      if (!detectedName) {
        if (user.displayName) {
          detectedName = user.displayName;
        } else if (user.email) {
          const rawName = user.email.split('@')[0];
          detectedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
        } else {
          detectedName = "Giocatore";
        }
      }

      // 3. Aggiorna l'interfaccia
      usernameElem.innerText = detectedName;
      statusElem.innerText = "Connesso";
      statusElem.style.color = "#4ade80";
      logoutBtn.classList.remove('hidden');

    } else {
      usernameElem.innerText = "Non connesso";
      usernameElem.style.color = "#94a3b8";
      statusElem.innerText = "Nessun account attivo";
      statusElem.style.color = "#f87171";
      logoutBtn.classList.add('hidden');
    }
  });

  window.handleLogout = function() {
    signOut(auth).then(() => {
      window.location.reload();
    });
  };
</script>
</body>
</html>
