<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo Giocatore - TeenagersITA Cards</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090e18 url('sfondohome.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 20px;
    }

    /* SFONDO SCURO E SFOCATO */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* BOX CENTRALE RESPONSIVE */
    .card-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    /* BADGE LIVELLO IN ALTO A DESTRA */
    .level-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .level-icon-top {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }

    /* AVATAR CIRCOLARE */
    .profile-avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .change-img-link {
      display: inline-block;
      font-size: 0.85rem;
      color: #60a5fa;
      text-decoration: none;
      margin-bottom: 22px;
      transition: opacity 0.2s;
    }

    .change-img-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* BOX INFORMATIVI */
    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
      text-align: left;
    }

    .info-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
    }

    .level-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .level-mini-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    /* PULSANTE DISCONNETTI */
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
      transition: all 0.2s ease;
      margin-top: 18px;
    }

    .btn:hover {
      background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
      transform: translateY(-1px);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #64748b;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="card-container">
    
    <!-- BADGE LIVELLO IN ALTO A DESTRA -->
    <div class="level-badge" title="Il tuo Livello">
      <img id="level-top-img" src="1.png" alt="Livello 1" class="level-icon-top">
    </div>

    <!-- AVATAR -->
    <img src="logo.png" alt="Avatar Giocatore" class="profile-avatar">
    
    <h1>Profilo Giocatore</h1>
    <a href="#" class="change-img-link" onclick="alert('Funzione cambio immagine in arrivo!'); return false;">📷 Cambia Immagine</a>

    <!-- NOME UTENTE -->
    <div class="info-box">
      <div class="info-label">Nome Utente</div>
      <div id="username-display" class="info-value">-</div>
    </div>

    <!-- LIVELLO -->
    <div class="info-box">
      <div class="info-label">Livello</div>
      <div class="level-row">
        <span id="level-text-display" class="info-value">Livello 1</span>
        <img id="level-box-img" src="1.png" alt="Badge Livello" class="level-mini-icon">
      </div>
    </div>

    <!-- DISCONNETTI -->
    <button class="btn" onclick="handleLogout()">Disconnettiti</button>

    <div>
      <a href="index.html" class="back-link">← Torna al menu principale</a>
    </div>
  </div>

  <!-- SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
      authDomain: "teenagersita-cards.firebaseapp.com",
      projectId: "teenagersita-cards",
      storageBucket: "teenagersita-cards.firebasestorage.app",
      messagingSenderId: "651917703980",
      appId: "1:651917703980:web:d4c8f87b4645e97c46ca89"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Caricamento immediato da localStorage per non mostrare "Caricamento..."
    function loadLocalAccountData() {
      const savedLevel = localStorage.getItem('user_level') || '1';
      const savedUsername = localStorage.getItem('username') || localStorage.getItem('nickname');

      if (savedUsername) {
        document.getElementById('username-display').innerText = savedUsername;
      }

      document.getElementById('level-text-display').innerText = `Livello ${savedLevel}`;
      document.getElementById('level-top-img').src = `${savedLevel}.png`;
      document.getElementById('level-box-img').src = `${savedLevel}.png`;
    }

    loadLocalAccountData();

    // Sincronizzazione con Firebase Auth & Firestore
    onAuthStateChanged(auth, async (user) => {
      const usernameElem = document.getElementById('username-display');

      if (user) {
        let detectedName = "";

        try {
          const userDocRef = doc(db, "utenti", user.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists()) {
            const data = userDocSnap.data();
            if (data.username) detectedName = data.username;
            else if (data.nickname) detectedName = data.nickname;
            else if (data.displayName) detectedName = data.displayName;
          }
        } catch (err) {
          console.warn("Firestore error:", err);
        }

        if (!detectedName) {
          if (user.displayName) {
            detectedName = user.displayName;
          } else if (user.email) {
            const rawName = user.email.split('@')[0];
            detectedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
          } else {
            detectedName = "Giocatore";
          }
        }

        usernameElem.innerText = detectedName;
        localStorage.setItem('username', detectedName);
      } else {
        if (usernameElem.innerText === "-" || usernameElem.innerText === "Caricamento...") {
          usernameElem.innerText = "Ospite";
        }
      }
    });

    window.handleLogout = function() {
      signOut(auth).then(() => {
        localStorage.removeItem('username');
        localStorage.removeItem('user_level');
        window.location.href = 'index.html';
      });
    };
  </script>

</body>
</html>
