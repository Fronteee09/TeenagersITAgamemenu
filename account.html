<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Carte TeenagersITA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090e18 url('sfondocarte1.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    .card-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.6rem;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.7);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #3b82f6;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .hidden {
      display: none;
    }

    .stat-box {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      text-align: left;
    }

    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="card-container">
    
    <!-- SCHERMATA LOGIN / REGISTRAZIONE -->
    <div id="auth-section">
      <h2 id="form-title">Accedi al tuo account</h2>
      
      <div class="input-group" id="username-group" style="display: none;">
        <label>Nome Utente</label>
        <input type="text" id="username" placeholder="Es: Gamer123">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="nome@email.com">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="btn" id="btn-main" onclick="handleAuth()">Accedi</button>
      <button class="btn btn-secondary" id="btn-toggle" onclick="toggleMode()">Non hai un account? Registrati</button>
    </div>

    <!-- SCHERMATA PROFILO (Visibile dopo il Login) -->
    <div id="profile-section" class="hidden">
      <h2>Profilo Giocatore</h2>
      
      <div class="stat-box">
        <small style="color: #94a3b8;">Nome Utente</small>
        <div id="user-display-name" style="font-weight: bold; font-size: 1.1rem;">-</div>
      </div>

      <div class="stat-box">
        <small style="color: #94a3b8;">Livello</small>
        <div id="user-level" style="font-weight: bold; color: #60a5fa;">Livello 1</div>
      </div>

      <button class="btn btn-secondary" onclick="logout()">Disconnetti</button>
    </div>

    <a href="index.html" class="back-link">← Torna al menu principale</a>
  </div>

  <!-- SCRIPT FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configurazione Firebase con le tue chiavi
    const firebaseConfig = {
      apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
      authDomain: "teenagersita-cards.firebaseapp.com",
      projectId: "teenagersita-cards",
      storageBucket: "teenagersita-cards.firebasestorage.app",
      messagingSenderId: "651917703980",
      appId: "1:651917703980:web:d4c8f87b4645e97c46ca89",
      measurementId: "G-84P57RTZEV"
    };

    // Inizializza Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;

    // Cambia modalità tra Login e Registrazione
    window.toggleMode = function() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('form-title').innerText = isRegisterMode ? "Crea un Account" : "Accedi al tuo account";
      document.getElementById('username-group').style.display = isRegisterMode ? "block" : "none";
      document.getElementById('btn-main').innerText = isRegisterMode ? "Registrati" : "Accedi";
      document.getElementById('btn-toggle').innerText = isRegisterMode ? "Hai già un account? Accedi" : "Non hai un account? Registrati";
    };

    // Gestione Login / Registrazione
    window.handleAuth = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value;

      if (!email || !password) {
        alert("Inserisci email e password.");
        return;
      }

      try {
        if (isRegisterMode) {
          if (!username) {
            alert("Inserisci un nome utente.");
            return;
          }
          // Registrazione nuovo utente
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Salva i dati iniziali su Firestore
          await setDoc(doc(db, "users", user.uid), {
            username: username,
            level: 1,
            cardsUnlocked: []
          });

        } else {
          // Login utente esistente
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert("Errore: " + error.message);
      }
    };

    // Logout
    window.logout = function() {
      signOut(auth);
    };

    // Controllo Stato Autenticazione
    onAuthStateChanged(auth, async (user) => {
      const authSection = document.getElementById('auth-section');
      const profileSection = document.getElementById('profile-section');

      if (user) {
        authSection.classList.add('hidden');
        profileSection.classList.remove('hidden');

        // Recupera i dati da Firestore
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('user-display-name').innerText = data.username || "Giocatore";
          document.getElementById('user-level').innerText = "Livello " + (data.level || 1);
        }
      } else {
        authSection.classList.remove('hidden');
        profileSection.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
