<!-- SCRIPT FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc,
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
      authDomain: "teenagersita-cards.firebaseapp.com",
      projectId: "teenagersita-cards",
      storageBucket: "teenagersita-cards.firebasestorage.app",
      messagingSenderId: "651917703980",
      appId: "1:651917703980:web:d4c8f87b4645e97c46ca89",
      measurementId: "G-84P57RTZEV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let isRegisterMode = false;
    let currentUser = null;

    window.toggleMode = function() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('form-title').innerText = isRegisterMode ? "Crea un Account" : "Accedi al tuo account";
      document.getElementById('btn-main').innerText = isRegisterMode ? "Registrati" : "Accedi";
      document.getElementById('btn-toggle').innerText = isRegisterMode ? "Hai già un account? Accedi" : "Non hai un account? Registrati";
    };

    window.handleAuth = async function() {
      const usernameInput = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!usernameInput || !password) {
        alert("Inserisci Nome Utente e Password.");
        return;
      }

      // Convertiamo lo username inserito in un formato e-mail valido per Firebase Auth
      const cleanUsername = usernameInput.toLowerCase().replace(/\s+/g, '');
      const internalEmail = `${cleanUsername}@teenagersita.local`;

      try {
        if (isRegisterMode) {
          const userCredential = await createUserWithEmailAndPassword(auth, internalEmail, password);
          const user = userCredential.user;

          // Salviamo lo username esatto (con maiuscole/spazi scelti dall'utente) su Firestore
          await setDoc(doc(db, "users", user.uid), {
            username: usernameInput,
            level: 1,
            photoURL: "",
            cardsUnlocked: []
          });

        } else {
          await signInWithEmailAndPassword(auth, internalEmail, password);
        }
      } catch (error) {
        alert("Errore: Nome utente o password non validi.");
      }
    };

    // CARICAMENTO IMMAGINE SU FIREBASE STORAGE
    window.uploadAvatar = async function(event) {
      const file = event.target.files[0];
      if (!file || !currentUser) return;

      const statusEl = document.getElementById('upload-status');
      statusEl.style.display = 'block';
      statusEl.innerText = "Caricamento in corso...";

      try {
        const storageRef = ref(storage, `avatars/${currentUser.uid}`);
        await uploadBytes(storageRef, file);
        const downloadURL = await getDownloadURL(storageRef);

        await updateDoc(doc(db, "users", currentUser.uid), {
          photoURL: downloadURL
        });

        document.getElementById('user-avatar').src = downloadURL;
        statusEl.innerText = "Immagine aggiornata!";
        setTimeout(() => { statusEl.style.display = 'none'; }, 2000);

      } catch (err) {
        console.error(err);
        statusEl.innerText = "Errore nel caricamento.";
      }
    };

    window.logout = function() {
      const confirmLogout = confirm("Sei sicuro di volerti disconnettere?");
      if (confirmLogout) {
        signOut(auth);
      }
    };

    onAuthStateChanged(auth, async (user) => {
      const authSection = document.getElementById('auth-section');
      const profileSection = document.getElementById('profile-section');

      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        profileSection.classList.remove('hidden');

        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          const userLevel = data.level || 1;

          // Mostra lo Username salvato su Firestore
          document.getElementById('user-display-name').innerText = data.username || "Giocatore";
          document.getElementById('user-level').innerText = "Livello " + userLevel;

          if (data.photoURL) {
            document.getElementById('user-avatar').src = data.photoURL;
          } else {
            document.getElementById('user-avatar').src = "logo.png";
          }

          const levelIconImg = document.getElementById('user-level-icon');
          levelIconImg.src = `${userLevel}.png`;
          levelIconImg.style.display = 'inline-block';

          levelIconImg.onerror = function() {
            if (this.src !== '1.png') {
              this.src = '1.png';
            }
          };
        } else {
          // Se per qualche motivo il documento Firestore non esiste ancora
          document.getElementById('user-display-name').innerText = "Giocatore";
        }
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        profileSection.classList.add('hidden');
      }
    });
  </script>
