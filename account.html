<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo Giocatore - TeenagersITA Cards</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090e18 url('sfondohome.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 20px;
    }

    /* SFONDO SCURO E SFOCATO */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* BOX CENTRALE RESPONSIVE */
    .card-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    /* BADGE LIVELLO IN ALTO A DESTRA */
    .level-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .level-icon-top {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }

    /* AVATAR CIRCOLARE */
    .profile-avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .change-img-link {
      display: inline-block;
      font-size: 0.85rem;
      color: #60a5fa;
      text-decoration: none;
      margin-bottom: 22px;
      transition: opacity 0.2s;
    }

    .change-img-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* BOX INFORMATIVI */
    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
      text-align: left;
    }

    .info-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
    }

    .level-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .level-mini-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    /* INPUTS & FORMS */
    .auth-input {
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .auth-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    .tabs {
      display: flex;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 3px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }

    /* PULSANTI */
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn:hover {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #64748b;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #94a3b8;
    }

    .hidden { display: none !important; }

    #auth-error {
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="card-container">
    
    <!-- BADGE LIVELLO IN ALTO A DESTRA -->
    <div class="level-badge" title="Il tuo Livello">
      <img id="level-top-img" src="1.png" alt="Livello 1" class="level-icon-top">
    </div>

    <!-- AVATAR -->
    <img src="logo.png" alt="Avatar Giocatore" class="profile-avatar">
    
    <h1 id="page-title">Profilo Giocatore</h1>
    <a href="#" id="change-img-btn" class="change-img-link" onclick="alert('Funzione cambio immagine in arrivo!'); return false;">📷 Cambia Immagine</a>

    <!-- SEZIONE PROFILO (Visibile se loggato) -->
    <div id="profile-section" class="hidden">
      <div class="info-box">
        <div class="info-label">Nome Utente</div>
        <div id="username-display" class="info-value">-</div>
      </div>

      <div class="info-box">
        <div class="info-label">Livello</div>
        <div class="level-row">
          <span id="level-text-display" class="info-value">Livello 1</span>
          <img id="level-box-img" src="1.png" alt="Badge Livello" class="level-mini-icon">
        </div>
      </div>

      <button class="btn btn-danger" onclick="handleLogout()">Disconnettiti</button>
    </div>

    <!-- SEZIONE AUTENTICAZIONE (Visibile se NON loggato) -->
    <div id="auth-section">
      <div class="tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchMode('login')">Accedi</button>
        <button id="tab-register" class="tab-btn" onclick="switchMode('register')">Registrati</button>
      </div>

      <form onsubmit="handleAuth(event)">
        <input type="text" id="auth-nickname" class="auth-input" placeholder="Il tuo Nickname" required autocomplete="username">
        <input type="password" id="auth-password" class="auth-input" placeholder="Password (min. 6 caratteri)" required autocomplete="current-password">
        <div id="auth-error"></div>
        <button type="submit" id="auth-submit-btn" class="btn">Accedi</button>
      </form>
    </div>

    <div>
      <a href="index.html" class="back-link">← Torna al menu principale</a>
    </div>
  </div>

  <!-- SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
      authDomain: "teenagersita-cards.firebaseapp.com",
      projectId: "teenagersita-cards",
      storageBucket: "teenagersita-cards.firebasestorage.app",
      messagingSenderId: "651917703980",
      appId: "1:651917703980:web:d4c8f87b4645e97c46ca89"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let authMode = 'login';

    window.switchMode = function(mode) {
      authMode = mode;
      document.getElementById('auth-error').innerText = '';
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submitBtn.innerText = "Accedi";
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submitBtn.innerText = "Registrati";
      }
    };

    // Aggiornamento livello e grafica locale
    function loadLevelData() {
      const savedLevel = localStorage.getItem('user_level') || '1';
      document.getElementById('level-text-display').innerText = `Livello ${savedLevel}`;
      document.getElementById('level-top-img').src = `${savedLevel}.png`;
      document.getElementById('level-box-img').src = `${savedLevel}.png`;
    }

    loadLevelData();

    onAuthStateChanged(auth, async (user) => {
      const profileSection = document.getElementById('profile-section');
      const authSection = document.getElementById('auth-section');
      const usernameElem = document.getElementById('username-display');
      const changeImgBtn = document.getElementById('change-img-btn');

      if (user) {
        authSection.classList.add('hidden');
        profileSection.classList.remove('hidden');
        changeImgBtn.style.display = 'inline-block';

        let detectedName = "";
        try {
          const userDocRef = doc(db, "utenti", user.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists()) {
            const data = userDocSnap.data();
            if (data.username) detectedName = data.username;
            else if (data.nickname) detectedName = data.nickname;
          }
        } catch (err) {
          console.warn("Firestore error:", err);
        }

        if (!detectedName) {
          if (user.email) {
            const rawName = user.email.split('@')[0];
            detectedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
          } else {
            detectedName = "Giocatore";
          }
        }

        usernameElem.innerText = detectedName;
      } else {
        profileSection.classList.add('hidden');
        authSection.classList.remove('hidden');
        changeImgBtn.style.display = 'none';
      }
    });

    window.handleAuth = async function(e) {
      e.preventDefault();
      const inputNick = document.getElementById('auth-nickname').value.trim();
      const password = document.getElementById('auth-password').value;
      const errorDiv = document.getElementById('auth-error');
      errorDiv.innerText = "";

      if (!inputNick) {
        errorDiv.innerText = "Inserisci un nickname.";
        return;
      }

      const cleanNick = inputNick.toLowerCase().replace(/[^a-z0-9_]/g, '');
      const emailToUse = cleanNick + "@teenagersita.local";

      try {
        if (authMode === 'login') {
          await signInWithEmailAndPassword(auth, emailToUse, password);
        } else {
          const userCred = await createUserWithEmailAndPassword(auth, emailToUse, password);
          // Salva su Firestore
          await setDoc(doc(db, "utenti", userCred.user.uid), {
            username: inputNick,
            createdAt: new Date()
          });
        }
      } catch (err) {
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          errorDiv.innerText = "Nickname o Password non corretti.";
        } else if (err.code === 'auth/email-already-in-use') {
          errorDiv.innerText = "Questo nickname è già registrato!";
        } else if (err.code === 'auth/weak-password') {
          errorDiv.innerText = "La password deve avere almeno 6 caratteri.";
        } else {
          errorDiv.innerText = "Errore: " + err.message;
        }
      }
    };

    window.handleLogout = function() {
      signOut(auth).then(() => {
        window.location.reload();
      });
    };
  </script>

</body>
</html>
