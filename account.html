<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo Account - TeenagersITA</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090e18 url('sfondohome.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 20px;
    }

    /* SFONDO SCURO E SFOCATO */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* BOX CENTRALE RESPONSIVE */
    .card-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    .logo-img {
      width: 90px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    /* BOX INFORMAZIONI ACCOUNT */
    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: left;
    }

    .info-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .username-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 14px;
      text-shadow: 0 0 10px rgba(96,165,250,0.3);
    }

    .info-value {
      font-size: 0.95rem;
      color: #ffffff;
      font-weight: 500;
    }

    /* CONTENITORE PULSANTI */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      box-shadow: none;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .hidden { display: none !important; }

    .credits {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="card-container">
    <img src="logo.png" alt="Logo TeenagersITA" class="logo-img">
    
    <h1>Il tuo Profilo</h1>
    <p>Gestisci le informazioni del tuo account di gioco.</p>

    <!-- BOX DATI -->
    <div class="info-box">
      <div class="info-label">Nickname</div>
      <div id="username-display" class="username-title">Caricamento...</div>
      
      <div class="info-label">Stato Account</div>
      <div id="status-display" class="info-value">Verifica in corso...</div>
    </div>

    <!-- PULSANTI -->
    <div class="btn-group">
      <a href="index.html" class="btn btn-secondary">Torna alla Home</a>
      <button id="logout-btn" class="btn btn-danger hidden" onclick="handleLogout()">Disconnettiti</button>
    </div>

    <div class="credits">
      Sviluppato da <strong>Fronte ★ (u/Unknow_guy21)</strong> • v1.0
    </div>
  </div>

  <!-- SCRIPT FIREBASE & GESTIONE NICKNAME -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
      authDomain: "teenagersita-cards.firebaseapp.com",
      projectId: "teenagersita-cards",
      storageBucket: "teenagersita-cards.firebasestorage.app",
      messagingSenderId: "651917703980",
      appId: "1:651917703980:web:d4c8f87b4645e97c46ca89"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      const usernameElem = document.getElementById('username-display');
      const statusElem = document.getElementById('status-display');
      const logoutBtn = document.getElementById('logout-btn');

      if (user) {
        let detectedName = "";

        // Prova a leggere da Firestore
        try {
          const userDocRef = doc(db, "utenti", user.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists()) {
            const data = userDocSnap.data();
            if (data.username) detectedName = data.username;
            else if (data.nickname) detectedName = data.nickname;
            else if (data.displayName) detectedName = data.displayName;
          }
        } else {
          console.warn("Impossibile leggere il documento utente.");
        }

        // Fallback sull'email o metadata se Firestore non risponde
        if (!detectedName) {
          if (user.displayName) {
            detectedName = user.displayName;
          } else if (user.email) {
            const rawName = user.email.split('@')[0];
            detectedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
          } else {
            detectedName = "Giocatore";
          }
        }

        usernameElem.innerText = detectedName;
        statusElem.innerText = "Connesso";
        statusElem.style.color = "#4ade80";
        logoutBtn.classList.remove('hidden');

      } else {
        usernameElem.innerText = "Non connesso";
        usernameElem.style.color = "#94a3b8";
        statusElem.innerText = "Nessun account attivo";
        statusElem.style.color = "#f87171";
        logoutBtn.classList.add('hidden');
      }
    });

    window.handleLogout = function() {
      signOut(auth).then(() => {
        window.location.reload();
      });
    };
  </script>

</body>
</html>
