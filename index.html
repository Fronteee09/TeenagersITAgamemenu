<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeenagersITA Cards</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090e18 url('sfondocarte1.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    .card-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    .logo-img {
      width: 85px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }

    h1 {
      font-size: 1.7rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn:hover {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .credits {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="card-container">
    <img src="logo.png" alt="Logo TeenagersITA Cards" class="logo-img">
    
    <h1>TeenagersITA Cards</h1>
    <p class="subtitle">Benvenuto! Sfidaci e colleziona le carte della community.</p>

    <!-- Pulsanti principali del menu -->
    <a href="account.html" class="btn">Profilo / Account</a>
    <a href="#" class="btn btn-secondary">Gioca contro il Bot</a>

    <!-- Crediti della community -->
    <div class="credits">
      Sviluppato da <strong>TeenagersITA</strong> • v1.0
    </div>
  </div>

</body>
</html>
