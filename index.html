<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeenagersITA Cards</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #090e18 url('sfondocarte1.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
    }

    .site-logo {
      width: 45px;
      height: 45px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .main-content {
      margin-top: 60px;
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }

    .hero-logo {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }

    .btn-play {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 25px;
      font-size: 1.1rem;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: transform 0.2s;
    }

    .btn-play:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo-container">
      <img src="logo.png" alt="Logo Titacards" class="site-logo">
      <span class="brand-title">TeenagersITA Cards</span>
    </a>
    <nav class="nav-links">
      <a href="account.html">Account / Profilo</a>
    </nav>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <div class="main-content">
    <img src="logo.png" alt="Logo TeenagersITA Cards" class="hero-logo">
    <h1>Benvenuto su TeenagersITA Cards</h1>
    <p style="color: #94a3b8; margin-top: 10px;">Colleziona le carte, sfida i bot e scala la classifica!</p>
    
    <a href="account.html" class="btn-play">Gioca Ora</a>
  </div>

</body>
</html>
