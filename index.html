<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeenagersITA Cards</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090e18 url('sfondohome.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 20px;
    }

    /* SFONDO SCURO E SFOCATO */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* BOX CENTRALE RESPONSIVE */
    .card-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    /* BADGE LIVELLO IN ALTO A DESTRA */
    .level-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .level-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }

    .logo-img {
      width: 90px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    /* CONTENITORE PULSANTI */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .credits {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="card-container">
    
    <!-- ICONA LIVELLO IN ALTO A DESTRA -->
    <div class="level-badge" title="Il tuo Livello">
      <img id="level-img" src="1.png" alt="Livello 1" class="level-icon">
    </div>

    <img src="logo.png" alt="Logo TeenagersITA" class="logo-img">
    
    <h1>TeenagersITA Cards</h1>
    <p>Colleziona le carte, sfida gli amici online o i bot e scala la classifica.</p>

    <div class="btn-group">
      <a href="multiplayer.html" class="btn">Multiplayer (Stanze)</a>
      <a href="account.html" class="btn btn-secondary">Profilo / Account</a>
      <a href="#" class="btn btn-secondary">Gioca contro il Bot</a>
    </div>

    <div class="credits">
      Sviluppato da <strong>Fronte ★ (u/Unknow_guy21)</strong> • v1.0
    </div>
  </div>

  <script>
    // Recupera il livello dal localStorage (default 1) e imposta l'icona dinamica
    const userLevel = localStorage.getItem('user_level') || 1;
    const levelImg = document.getElementById('level-img');
    levelImg.src = `${userLevel}.png`;
    levelImg.alt = `Livello ${userLevel}`;
  </script>

</body>
</html>
